<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Météo</title>
  <link rel="stylesheet" href="style.css">
</head>


<body>
  <div class="weather-app"> 
    <h1>Application Météo</h1>
    <p>Entrez une ville pour obtenir les informations météo :</p>
    <div class="search-container">
      <input type="text" id="cityInput" placeholder="Nom de la ville">
      <button id="searchButton">Rechercher</button>
    </div>
    <div id="weather-result">
    </div>
  </div>
  <div classe="box-container">
  <div id="cityName" class="box"></div>
  <div id="temp" class="box"></div>
  <div id="humidity" class="box"></div>
  <div id="wind" class="box"></div>
  <div id="conditions" class="box"></div>
  </div>
  <script src="script.js"></script>
</body>

</html>
